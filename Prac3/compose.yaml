services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cleaning
      POSTGRES_USER: cleaning
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
